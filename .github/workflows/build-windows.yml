name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "wb_analyzer/**"
      - "desktop/**"
      - "scripts/build_windows.ps1"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build desktop package
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WB-Analyzer-Windows
          path: dist/WB-Analyzer-Windows.zip
          if-no-files-found: error

      - name: Upload unzipped app folder
        uses: actions/upload-artifact@v4
        with:
          name: WB-Analyzer-Windows-folder
          path: dist/WB-Analyzer/
          if-no-files-found: error
