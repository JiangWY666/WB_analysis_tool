[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-gray-analyzer"
version = "0.2.3"
description = "Western Blot densitometry with ROI tools, ruler align, and figure export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "tkinterdnd2>=0.3.0",
  "windnd>=1.0.7; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
build = ["pyinstaller>=6.3"]

[project.scripts]
wb-analyzer = "wb_analyzer.gui:main"
wb-analyze = "wb_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["wb_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
