[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-gray-analyzer"
version = "0.4.0"
description = "Western Blot densitometry with a PySide6 GUI: native bit-depth quantification, ROI lane tools, intensity profiles, and fold-change normalization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<6",
  "Pillow>=10.0,<13",
  # Qt 7 will rename the Qt6* DLLs that desktop/wb-analyzer.spec filters on.
  "PySide6>=6.6,<7",
  # pyqtgraph is pre-1.0: a 1.0 release is expected to be a breaking rewrite.
  "pyqtgraph>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]
build = ["pyinstaller>=6.3,<8"]

[project.scripts]
wb-analyzer = "wb_analyzer.ui.app:main"
wb-analyze = "wb_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["wb_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
