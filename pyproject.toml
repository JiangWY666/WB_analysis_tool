[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-gray-analyzer"
version = "0.1.1"
description = "Automatic Western Blot lane, band and grayscale analyzer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
wb-analyzer = "wb_analyzer.gui:main"
wb-analyze = "wb_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
